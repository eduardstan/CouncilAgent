[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "councilagent"
version = "0.3.0.dev0"
description = "CouncilAgent — the first multi-LLM council you can model-check. A neuro-symbolic deliberation framework with typed Move/Trace, LTL_f runtime monitoring, BAF/QBAF gradual-semantics aggregation, calibrated disagreement, cost-aware cascade, quality-diversity over compositions, and ILP-induced protocols."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Eduard Ionel Stan" }]
dependencies = [
    "httpx>=0.27",
    "litellm>=1.50",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Development tooling: pytest, mypy strict, ruff, freezegun.
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "pytest-timeout>=2.3",
    "freezegun>=1.5",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-requests",
]
# Benchmark statistics: bootstrap, Wilcoxon, AIPW, Bradley-Terry, mixed-effects.
benchmark = [
    "datasets>=2.19",
    "mlflow>=2.14",
    "scipy>=1.13",
    "statsmodels>=0.14",
    "scikit-learn>=1.5",
    "numpy>=1.26",
    "hydra-core>=1.3",
]
# Embedding-based metrics (sentence-transformers, ~2 GB with CUDA).
# Install torch first if needed:
#   pip install torch --index-url https://download.pytorch.org/whl/cpu
#   uv pip install 'councilagent[embeddings]'
embeddings = [
    "sentence-transformers>=3.0",
]
# L1 — verification spine (SPOT for LTL_f → Büchi → DFA).
# SPOT must be installed separately: conda install -c conda-forge spot
# or built from source (https://spot.lrde.epita.fr/install.html)
verify = [
]
# L2 — argumentation (pure Python; ASP-extension semantics need clingo).
argue = [
]
# L2 — ASP-backed extension semantics (preferred / stable / grounded).
argue-asp = [
    "clingo>=5.7",
]
# L3 — calibration (numpy + scipy + scikit-learn already in `benchmark`).
calibrate = [
]
# L4 — cascade (no extra deps; uses LiteLLM).
cascade = [
]
# L5 — quality-diversity (CMA-MAE on pyribs; pure-Python random-search fallback exists).
evolve = [
    "ribs>=0.7",
    "cma>=4.0",
]
# L6 — ILP / ASP rule mining.
ilp = [
    "clingo>=5.7",
    # Popper and ILASP4 are external binaries — installed separately.
]
# Full NS install: every layer's dependencies.
full = [
    "councilagent[dev,benchmark,embeddings,verify,argue-asp,evolve,ilp]",
]

[tool.setuptools.packages.find]
include = ["council*"]
exclude = ["tests*", "legacy_council*", "papers*", "apps*", "experiments*", "evaluation*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "integration: real model calls, gated by RUN_INTEGRATION=1",
]
timeout = 180
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:litellm.*",
]

[tool.coverage.run]
source = ["council"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "\\.\\.\\.",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "legacy_council", "LLMCouncil_Deep_Review.md", "COUNCIL_NS_PLAN.md", "COUNCILAGENT_NS_MASTER_PLAN.md", "papers"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle + pyflakes
    "I",              # isort
    "B",              # bugbear
    "UP",             # pyupgrade
    "SIM",            # simplify
    "RUF",            # ruff-specific
]
ignore = [
    "E501",  # line too long — formatter handles it
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011", "SIM117"]

# NS Constitution §3 + §4 + §5 are type-enforced — mypy strict on ALL of council/.
[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
strict = true
exclude = [
    "legacy_council/",
    "papers/",
]

# Third-party libraries without stubs.
[[tool.mypy.overrides]]
module = [
    "litellm",
    "litellm.*",
    "ribs",
    "ribs.*",
    "cma",
    "spot",
    "clingo",
    "mlflow",
    "mlflow.*",
    "hydra",
    "hydra.*",
]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "pytest-timeout>=2.4.0",
]
