[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "council-agent"
version = "0.1.0dev0"
description = "CouncilAgent — a drop-in multi-model LLM replacement with calibrated confidence from inter-agent agreement."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Eduard Ionel Stan" }]
dependencies = [
    "httpx>=0.27",
    "litellm>=1.50",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "freezegun>=1.5",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-requests",
]

[tool.setuptools.packages.find]
include = ["council*"]
exclude = ["tests*", "specs*", "experiments*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "integration: real model calls, gated by RUN_INTEGRATION=1",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:litellm.*",
]

[tool.coverage.run]
source = ["council"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "\\.\\.\\.",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "LLMCouncil_Deep_Review.md"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle + pyflakes
    "I",              # isort
    "B",              # bugbear
    "UP",             # pyupgrade
    "SIM",            # simplify
    "RUF",            # ruff-specific
]
ignore = [
    "E501",  # line too long — formatter handles it
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011", "SIM117"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "council.context",
    "council.core",
    "council.agent",
]
strict = true

[[tool.mypy.overrides]]
module = [
    "litellm",
    "litellm.*",
]
ignore_missing_imports = true
