# Ollama deliberation config — 3-round peer-review protocol with local models.
# Round 0: agents answer independently.
# Round 1: agents critique each other's answers.
# Round 2: agents revise their own answers based on critiques.
#
# Requires: ollama serve with qwen3:0.6b and deepseek-r1:1.5b pulled.

name: ollama_deliberate

dataset: gsm8k
task_limit: 5

council:
  models:
    - "ollama/qwen3:0.6b"
    - "ollama/deepseek-r1:1.5b"
  protocol: peer_review   # agents see each other and deliberate
  max_rounds: 3
  budget_usd: 0.0
  task_delay_seconds: 0.0

mlflow:
  tracking_uri: "mlruns"
