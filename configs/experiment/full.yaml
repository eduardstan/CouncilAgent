# Full benchmark config — 1 deliberation cycle, full GSM8K test split, free models.
# Runs in several hours depending on free-tier model latency.
# Use with experiments/sweep.py for the 4x4x5x3 configuration sweep.
#
# max_rounds = deliberation cycles after initial generation.
# With peer_review (default), 1 cycle = critique + revision = 3 total raw rounds.

name: full

dataset: gsm8k
task_limit: null  # full test split (~1319 problems)

council:
  models:
    - "openrouter/google/gemma-3-27b-it:free"
    - "openrouter/openai/gpt-oss-20b:free"
    - "openrouter/minimax/minimax-m2.5:free"
  max_rounds: 1            # 1 deliberation cycle (generate → critique → revise)
  budget_usd: 1.00

mlflow:
  tracking_uri: "mlruns"
  # experiment_name is auto-generated as council/{name}/{git_sha} if omitted
