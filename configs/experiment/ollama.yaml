# Ollama benchmark config — local models, no API keys or rate limits.
# Requires: ollama serve (running locally) with these models pulled:
#   ollama pull qwen3:0.6b
#   ollama pull deepseek-r1:1.5b
#
# Single round (direct) by default — set protocol: peer_review and
# max_rounds: 1 to enable one deliberation cycle.

name: ollama

dataset: gsm8k
task_limit: 10

council:
  models:
    - "ollama/qwen3:0.6b"
    - "ollama/deepseek-r1:1.5b"
  topology: complete          # complete | star | bus | ring | dynamic_star
  protocol: direct            # direct | peer_review | simultaneous
  aggregation: majority_vote  # majority_vote | borda | condorcet | meta_judge
  termination: fixed          # fixed | agreement | budget | composite
  max_rounds: 0               # 0 = generate only, no deliberation
  budget_usd: 0.0             # local models are free
  task_delay_seconds: 0.0

mlflow:
  tracking_uri: "mlruns"
