# Hydra sweep config — topology × protocol × aggregation × dataset
# Defines the default values; use --multirun with overrides for the full sweep.
#
# Example sweeps:
#   uv run python -m experiments.sweep --multirun \
#       council.topology=complete,star,bus,ring \
#       council.protocol=direct,peer_review,simultaneous \
#       council.aggregation=majority_vote,borda,condorcet,meta_judge \
#       council.max_rounds=0,1,2 \
#       dataset=gsm8k
#
# max_rounds = deliberation cycles after initial generation.
# With peer_review (cycle_length=2): max_rounds=1 → 3 raw rounds (generate+critique+revise).
# With direct/simultaneous (cycle_length=1): max_rounds=1 → 2 raw rounds.
# max_rounds=0 → generate-only regardless of protocol.
#
# Requires: uv pip install 'council-agent[benchmark]'

defaults:
  - _self_

name: sweep

dataset: gsm8k
task_limit: 50  # per sweep point — reduce to 10 for quick smoke tests

council:
  models:
    - "openrouter/google/gemma-3-27b-it:free"
    - "openrouter/openai/gpt-oss-20b:free"
    - "openrouter/minimax/minimax-m2.5:free"
  topology: complete          # complete | star | bus | ring | dynamic_star
  protocol: peer_review       # direct | peer_review | simultaneous
  aggregation: majority_vote  # majority_vote | borda | condorcet | meta_judge
  termination: fixed          # fixed | agreement | budget | composite
  # meta_judge_model: "openrouter/..."  # optional: dedicated synthesis model for meta_judge
  #                                     # defaults to models[0] when omitted
  max_rounds: 1               # deliberation cycles (not raw rounds)
  budget_usd: 1.00

mlflow:
  tracking_uri: "mlruns"
  # experiment_name auto-generated as council/{name}/{git_sha}
